function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function categoryId(name) {
  const found = categories.find(c => c.dataName === name);
  return found ? found.id : name.toLowerCase().replace(/[^a-z0-9]+/g, "-");
}

function createCard(item, index) {
  const tags = (item.tags || [])
    .map(tag => `<span class="tag">${escapeHtml(tag)}</span>`)
    .join("");

  return `
    <div class="col-12 col-md-6 col-xl-4 prompt-result"
         data-search="${escapeHtml([
           item.title,
           item.category,
           item.subcategory,
           item.description,
           item.prompt,
           item.negative,
           ...(item.tags || [])
         ].join(" "))}">
      <article class="prompt-card">
        <div class="card-body-custom">
          <div class="eyebrow">${escapeHtml(item.subcategory || item.category)}</div>
          <h3 class="prompt-title">${escapeHtml(item.title)}</h3>
          <p class="prompt-description">${escapeHtml(item.description || "")}</p>

          <div class="mini-label">Prompt</div>
          <div class="prompt-box" id="prompt-${index}">${escapeHtml(item.prompt)}</div>

          <div class="mini-label">Negative / Restrictions</div>
          <div class="prompt-box negative-box" id="negative-${index}">${escapeHtml(item.negative || "")}</div>

          <div class="tags">${tags}</div>

          <div class="card-actions">
            <button class="btn btn-rj copy-btn"
                    data-copy-target="prompt-${index}"
                    type="button">
              Copy Prompt
            </button>
            <button class="btn btn-outline-rj copy-btn"
                    data-copy-target="negative-${index}"
                    type="button">
              Copy Negative
            </button>
          </div>
        </div>
      </article>
    </div>
  `;
}

function renderLibrary() {
  const library = document.getElementById("library");
  library.innerHTML = "";

  categories.forEach(category => {
    const items = prompts.filter(p => p.category === category.dataName);

    const section = document.createElement("section");
    section.className = "category-block";
    section.id = category.id;
    section.dataset.category = category.dataName;

    section.innerHTML = `
      <div class="category-header d-flex justify-content-between align-items-start gap-3"
           role="button"
           tabindex="0"
           aria-expanded="true">
        <div>
          <h2 class="category-title">${escapeHtml(category.name)}</h2>
          <p class="category-desc">${escapeHtml(category.description)}</p>
        </div>
        <span class="category-toggle">−</span>
      </div>

      <div class="category-content">
        <div class="row g-3">
          ${
            items.length
              ? items.map((item, i) => createCard(item, `${category.id}-${i}`)).join("")
              : `<div class="col-12"><div class="p-4 border rounded-3 text-secondary small">No prompts added yet. Add prompts to the <code>prompts</code> array in this same HTML file.</div></div>`
          }
        </div>
      </div>
    `;

    library.appendChild(section);
  });

  bindAccordion();
  bindCopyButtons();
}

function bindAccordion() {
  document.querySelectorAll(".category-header").forEach(header => {
    const toggle = () => {
      const content = header.nextElementSibling;
      const icon = header.querySelector(".category-toggle");
      const open = header.getAttribute("aria-expanded") === "true";

      header.setAttribute("aria-expanded", String(!open));
      content.style.display = open ? "none" : "block";
      icon.textContent = open ? "+" : "−";
    };

    header.addEventListener("click", toggle);
    header.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggle();
      }
    });
  });
}

function bindCopyButtons() {
  document.querySelectorAll(".copy-btn").forEach(button => {
    button.addEventListener("click", async () => {
      const target = document.getElementById(button.dataset.copyTarget);
      const originalText = button.textContent;

      try {
        await navigator.clipboard.writeText(target.textContent);
        button.textContent = "Copied ✓";

        setTimeout(() => {
          button.textContent = originalText;
        }, 1400);
      } catch (error) {
        // Fallback for browsers that block Clipboard API
        const temp = document.createElement("textarea");
        temp.value = target.textContent;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        temp.remove();

        button.textContent = "Copied ✓";
        setTimeout(() => {
          button.textContent = originalText;
        }, 1400);
      }
    });
  });
}

function filterLibrary() {
  const query = document.getElementById("searchInput").value.trim().toLowerCase();
  const cards = document.querySelectorAll(".prompt-result");
  let visibleCards = 0;

  cards.forEach(card => {
    const text = card.dataset.search.toLowerCase();
    const visible = !query || text.includes(query);
    card.style.display = visible ? "" : "block";
    if (visible) visibleCards++;
  });

  document.querySelectorAll(".category-block").forEach(section => {
    const sectionCards = section.querySelectorAll(".prompt-result");
    const hasMatchingCard = [...sectionCards].some(card => card.style.display !== "none");

    if (query) {
      section.style.display = hasMatchingCard ? "" : "none";
    } else {
      section.style.display = "";
    }
  });

  document.getElementById("noResults").style.display =
    visibleCards === 0 ? "block" : "none";
}

document.getElementById("searchInput").addEventListener("input", filterLibrary);
